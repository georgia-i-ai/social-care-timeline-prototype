[project]
name = "social-care-timeline-prototype"
version = "0.1.0"
description = "Tinkering prototype backend: unstructured social care notes to a structured, reviewable timeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "litellm",
    "python-dotenv",
    "pillow",
    "openai-whisper",
    "truststore",
]

[tool.uv]
package = false
